<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抽象生物图鉴</title>
  <style>
    :root {
      --ink: #f7fbff;
      --muted: rgba(247, 251, 255, .68);
      --panel: rgba(7, 10, 24, .74);
      --line: rgba(255, 255, 255, .18);
      --cyan: #20e7ff;
      --pink: #ff3c83;
      --lime: #b9ff3b;
      --gold: #ffe56a;
      --shadow: 0 24px 70px rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }
    html { background: #050713; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(32,231,255,.26), transparent 28%),
        radial-gradient(circle at 80% 14%, rgba(255,60,131,.22), transparent 30%),
        linear-gradient(140deg, #060717 0%, #18104c 48%, #06182d 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(#000 0%, transparent 84%);
    }

    main {
      position: relative;
      z-index: 2;
      width: min(1240px, calc(100% - 36px));
      margin: 0 auto;
      padding: 34px 0 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 34px;
    }

    a, button {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255,255,255,.09);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 900;
      backdrop-filter: blur(14px);
      transition: transform .2s ease, filter .2s ease;
    }

    a:hover, button:hover { transform: translateY(-2px) rotate(-1deg); filter: saturate(1.18); }
    button.primary { color: #06101b; background: var(--lime); border: 0; box-shadow: 0 16px 40px rgba(185,255,59,.25); }

    .hero {
      display: grid;
      gap: 18px;
      padding: clamp(18px, 4vw, 34px);
      border-radius: 28px;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(185,255,59,.12), transparent 36%),
        linear-gradient(315deg, rgba(255,60,131,.12), transparent 38%),
        var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(46px, 8vw, 112px);
      line-height: .9;
      letter-spacing: 0;
      text-shadow: 0 0 34px rgba(32,231,255,.38), 6px 8px 0 rgba(255,60,131,.3);
    }

    .lead {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(15px, 1.8vw, 20px);
      line-height: 1.75;
    }

    .upload-card {
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    input[type="file"] {
      display: none;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      min-height: 340px;
      padding: clamp(18px, 4vw, 34px);
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.16);
      background:
        radial-gradient(circle at 16% 20%, rgba(32,231,255,.12), transparent 28%),
        rgba(7,10,24,.62);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      margin-top: 18px;
    }

    .card {
      position: relative;
      flex: 0 0 clamp(96px, 13vw, 154px);
      margin: 0 -18px 16px 0;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.17);
      background: rgba(255,255,255,.07);
      box-shadow: 0 18px 44px rgba(0,0,0,.25);
      transform: rotate(var(--tilt, 0deg));
      z-index: var(--z, 1);
      transition: transform .25s ease, z-index .25s ease;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      filter: saturate(1.08) contrast(1.04);
      transition: transform .35s ease, filter .35s ease;
    }

    .card:hover {
      z-index: 20;
      transform: rotate(0deg) scale(1.12);
    }

    .card:hover img {
      transform: scale(1.05);
      filter: saturate(1.35) contrast(1.1);
    }

    .card span {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 7px 9px;
      border-radius: 14px;
      color: var(--ink);
      background: rgba(0,0,0,.58);
      border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(12px);
      font-weight: 900;
      font-size: 12px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .card:hover span { opacity: 1; transform: translateY(0); }

    .empty {
      padding: 28px;
      border-radius: 22px;
      border: 1px dashed rgba(255,255,255,.26);
      color: var(--muted);
      background: rgba(255,255,255,.06);
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 22px;
      z-index: 8;
      width: min(560px, calc(100vw - 30px));
      padding: 15px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(4,8,18,.84);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      text-align: center;
      font-weight: 900;
      transform: translate(-50%, -120%);
      opacity: 0;
      pointer-events: none;
      transition: transform .35s ease, opacity .35s ease;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    footer {
      position: relative;
      z-index: 2;
      width: min(1240px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 34px;
      color: rgba(247,251,255,.58);
      text-align: center;
    }

    @media (max-width: 780px) {
      .topbar a, .topbar button, .upload-card button { width: 100%; }
      .card { flex-basis: 112px; margin-right: -10px; }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast">图鉴系统启动中...</div>
  <main>
    <div class="topbar">
      <a href="index.html">返回检测中心</a>
      <button id="refreshGallery">刷新图鉴</button>
    </div>

    <section class="hero">
      <div>
        <h1>抽象生物图鉴</h1>
        <p class="lead">点击投稿，把新的抽象生物塞进图鉴容器。</p>
      </div>

      <form class="upload-card" id="uploadForm">
        <input type="file" id="imageInput" name="image" accept="image/png,image/jpeg,image/gif,image/webp" required>
        <button class="primary" type="button" id="pickImage">投稿图片</button>
      </form>
    </section>

    <section class="gallery" id="gallery" aria-live="polite"></section>
  </main>

  <footer>
    Copyright © 2026 AI佳小乐抽象生物图鉴. All Rights Reserved.
  </footer>

  <script>
    const gallery = document.getElementById("gallery");
    const toast = document.getElementById("toast");
    let toastTimer = 0;

    function speak(text) {
      clearTimeout(toastTimer);
      toast.textContent = text;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
    }

    async function loadGallery() {
      try {
        const res = await fetch("/api/submissions");
        if (!res.ok) throw new Error("读取失败");
        const data = await res.json();
        const images = data.images.slice(0, 36);
        gallery.innerHTML = images.length ? images.map((item, index) => `
          <article class="card" style="--tilt:${((index % 7) - 3) * 3}deg;--z:${index + 1}">
            <img src="${item.url}" alt="${escapeHtml(item.title || `抽象生物 ${index + 1}`)}" loading="lazy">
            <span>${escapeHtml(item.title || `抽象生物 ${index + 1}`)}</span>
          </article>
        `).join("") : `<div class="empty">图鉴暂时为空，快来投稿第一张。</div>`;
      } catch (error) {
        gallery.innerHTML = `<div class="empty">请通过 <b>node server.mjs</b> 打开页面，图鉴投稿功能才会启用。</div>`;
      }
    }

    async function uploadSelectedImage() {
      const input = document.getElementById("imageInput");
      if (!input.files.length) return;
      const form = new FormData();
      form.append("image", input.files[0]);
      try {
        const res = await fetch("/api/submissions", { method: "POST", body: form });
        if (!res.ok) throw new Error("上传失败");
        input.value = "";
        speak("投稿成功，新的抽象生物已入库。");
        await loadGallery();
      } catch (error) {
        speak("投稿失败：请确认通过本地服务访问，并且图片格式正确。");
      }
    }

    document.getElementById("uploadForm").addEventListener("submit", event => event.preventDefault());
    document.getElementById("pickImage").addEventListener("click", () => document.getElementById("imageInput").click());
    document.getElementById("imageInput").addEventListener("change", uploadSelectedImage);
    document.getElementById("refreshGallery").addEventListener("click", loadGallery);
    loadGallery();
  </script>
</body>
</html>
